<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - LinkShield AI</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        🛡️ LinkShield AI
    </div>


    <ul class="nav-links">

        <li>
            <a href="index.html">
                Home
            </a>
        </li>

        <li>
            <a href="about.html">
                About
            </a>
        </li>

        <li>
            <a href="index.html#features">
                Features
            </a>
        </li>

        <li>
            <a href="index.html#contact">
                Contact
            </a>
        </li>

    </ul>


    <div class="nav-buttons">

        <a href="login.html"
           class="login-btn">
            Login
        </a>

        <a href="signup.html"
           class="signup-btn">
            Sign Up
        </a>

    </div>

</nav>



<!-- ================= LOGIN SECTION ================= -->

<main class="login-page">

    <div class="login-card">


        <div class="login-icon">
            🛡️
        </div>


        <h1>
            Welcome Back
        </h1>


        <p class="login-subtitle">
            Login to continue using LinkShield AI
        </p>



        <!-- ================= LOGIN FORM ================= -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>


                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        minlength="8"
                        required
                    >


                    <!-- ONLY ONE CUSTOM BUTTON -->

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('loginPassword', this)"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>



            <!-- LOGIN OPTIONS -->

            <div class="login-options">

                <label>

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>


                <a href="#">
                    Forgot Password?
                </a>

            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-submit"
            >
                Login
            </button>

        </form>



        <!-- SIGNUP -->

        <p class="signup-text">

            Don't have an account?

            <a href="signup.html">
                Create an account
            </a>

        </p>


    </div>

</main>



<script src="js/script.js"></script>

</body>

</html>
